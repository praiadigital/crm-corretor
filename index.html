<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CRM do Corretor — Praia Digital</title><meta name="description" content="Funil kanban de leads e clientes que funciona offline, direto no navegador."><link rel="canonical" href="https://praia.digital/crm-corretor/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8ecf1}main{max-width:1100px;margin:auto;padding:20px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.col{background:#0f172a;border:1px solid #243348;border-radius:12px;padding:10px;min-height:200px}.col h3{margin:4px 0 10px;font-size:14px}.lead{background:#1e293b;border-radius:8px;padding:8px;margin:6px 0;font-size:14px}input,select{padding:8px;border-radius:8px;background:#0f172a;color:#e8ecf1;border:1px solid #243348}.btn{padding:8px 14px;border-radius:8px;background:#1f6feb;color:#fff;border:0;cursor:pointer;font-weight:600}.lead button{float:right;background:none;border:0;color:#7dd3fc;cursor:pointer}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/curador-leads/" style="color:#9fd8ff;margin-right:12px">Curador de Leads</a><a href="https://praia.digital/whatsapp-kit/" style="color:#9fd8ff;margin-right:12px">WhatsApp Kit</a><a href="https://praia.digital/portal-corretores/" style="color:#9fd8ff">Portal do Corretor</a></nav><main><h1>📋 CRM do Corretor</h1><p>Funil simples que salva no seu navegador (offline, sem login).</p><p><input id="nm" placeholder="Nome do lead"> <select id="st"><option>Novo</option><option>Em contato</option><option>Visita</option><option>Fechamento</option></select> <button class="btn" onclick="add()">Adicionar</button></p><div class="board" id="b"></div></main><script>const COLS=['Novo','Em contato','Visita','Fechamento'];let L=JSON.parse(localStorage.getItem('crm')||'[]');function save(){localStorage.setItem('crm',JSON.stringify(L));render();}function add(){const n=document.getElementById('nm').value.trim();if(!n)return;L.push({n,s:document.getElementById('st').value});document.getElementById('nm').value='';save();}function mv(i,d){const j=COLS.indexOf(L[i].s)+d;if(j>=0&&j<4)L[i].s=COLS[j];save();}function del(i){L.splice(i,1);save();}function render(){document.getElementById('b').innerHTML=COLS.map(c=>'<div class="col"><h3>'+c+' ('+L.filter(x=>x.s===c).length+')</h3>'+L.map((x,i)=>x.s===c?'<div class="lead">'+x.n+'<button onclick="del('+i+')">✕</button><br><button onclick="mv('+i+',-1)">◀</button> <button onclick="mv('+i+',1)">▶</button></div>':'').join('')+'</div>').join('');}render();</script></body></html>
