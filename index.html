<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM do Corretor — funil de vendas no navegador</title>
<meta name="description" content="Mini CRM kanban para corretores do litoral: leads, visitas, propostas e fechamentos salvos no navegador. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
header{padding:24px;text-align:center;background:linear-gradient(120deg,#0f172a,#334155);color:#fff}
nav a{color:#fbbf24;margin:0 8px;text-decoration:none;font-size:14px}
.wrap{padding:20px;overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:14px;max-width:1200px;margin:auto}
.col{background:#e2e8f0;border-radius:14px;padding:12px}
.col h3{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:#475569;margin-bottom:10px}
.cardc{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cardc small{color:#64748b;display:block;margin:4px 0}
.cardc button{border:none;background:#e2e8f0;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;margin-right:4px}
form{max-width:1200px;margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap}
input{padding:11px;border-radius:10px;border:2px solid #cbd5e1;font-size:14px;flex:1;min-width:140px}
button.add{background:#0f172a;color:#fff;border:none;border-radius:10px;padding:11px 22px;cursor:pointer;font-weight:700}
footer{padding:20px;text-align:center;font-size:13px;color:#64748b}
footer a{color:#0f172a}
</style></head>
<body>
<header><h1>📇 CRM do Corretor</h1><p>Seu funil de vendas simples — tudo salvo no navegador, sem login</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/portal-corretores">Portal do Corretor</a><a href="https://praia.digital/whatsapp-kit">WhatsApp Kit</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap">
<form onsubmit="add(event)"><input id="nome" placeholder="Nome do cliente" required><input id="info" placeholder="Interesse (ex.: apê 2 dorm Boqueirão)"><input id="valor" type="number" placeholder="R$"><button class="add">+ Lead</button></form>
<div class="board" id="board"></div>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/comissao">Comissão</a> · <a href="https://praia.digital/seo-anuncio">SEO de Anúncio</a> · <a href="https://praia.digital/hermes-agents">Hermes Agents</a></footer>
<script>
const cols=['🧲 Leads','👀 Visitas','📝 Propostas','🤝 Fechados'];
const KEY='crmpraia';let dados=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(dados));}
function add(e){e.preventDefault();dados.push({n:nome.value,i:info.value,v:+valor.value||0,c:0});nome.value='';info.value='';valor.value='';save();draw();}
function move(i,d){dados[i].c=Math.max(0,Math.min(3,dados[i].c+d));save();draw();}
function del(i){if(confirm('Remover?')){dados.splice(i,1);save();draw();}}
function draw(){board.innerHTML=cols.map((c,ci)=>{const itens=dados.map((x,i)=>({x,i})).filter(o=>o.x.c===ci);
const tot=itens.reduce((s,o)=>s+o.x.v,0);
return `<div class="col"><h3>${c} (${itens.length})${tot?' · R$ '+tot.toLocaleString('pt-BR'):''}</h3>${itens.map(o=>`<div class="cardc"><b>${o.x.n}</b><small>${o.x.i||''}</small>${o.x.v?`<small>💰 R$ ${o.x.v.toLocaleString('pt-BR')}</small>`:''}<div><button onclick="move(${o.i},-1)">←</button><button onclick="move(${o.i},1)">→</button><button onclick="del(${o.i})">🗑</button></div></div>`).join('')}</div>`}).join('');}
draw();
</script></body></html>
